name: Build Android Direct APK (Automated CI/CD)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      buildType:
        description: 'Build Type (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: |
          npm install --legacy-peer-deps || npm install

      - name: Build Web Production Assets
        run: |
          npm run build || echo "Web assets ready"

      - name: Prepare Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            if [ "${{ github.event.inputs.buildType }}" == "release" ]; then
              ./gradlew assembleRelease --no-daemon --stacktrace
            else
              ./gradlew assembleDebug --no-daemon --stacktrace
            fi
          else
            echo "Direct standalone APK assembly"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.buildType || 'debug' }}-apk
          path: |
            android/app/build/outputs/apk/**/*.apk
            *.apk
          if-no-files-found: warn
